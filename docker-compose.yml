services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopping-cart-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Milu1234"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Milu1234 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopping-cart-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ShoppingCartDb;User Id=sa;Password=Milu1234;TrustServerCertificate=True"
      Jwt__Key: "CLAVE_SECRETA1234567891234567891"
      Jwt__Issuer: "ShoppingCartApi"
      Jwt__Audience: "ShoppingCartApp"
      Jwt__ExpiresMinutes: "60"
    ports:
      - "5000:8080"

volumes:
  sql_data: